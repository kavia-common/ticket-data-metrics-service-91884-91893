spring.application.name=devxdashboardbackend

# Bind service to the expected preview port
server.port=3001

# Disable H2 console (not needed for documentation-only service)
spring.h2.console.enabled=false

# Disable Actuator endpoints entirely
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=
management.endpoint.health.enabled=false

# Enable Swagger/OpenAPI documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configure canonical paths for API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Scan only the base packages (though no application controllers exist)
springdoc.packages-to-scan=com.example.devxdashboardbackend,com.example.demo

# Respect X-Forwarded-* / Forwarded headers for proxy environments
server.forward-headers-strategy=framework

# Disable Whitelabel error page so GlobalErrorController handles errors
server.error.whitelabel.enabled=false

# Error handling configuration (JSON responses via GlobalErrorController)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never
