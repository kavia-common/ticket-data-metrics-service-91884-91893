spring.application.name=devxdashboardbackend

# Bind service to the expected preview port
server.port=3001

# Disable H2 console and datasource (not needed when only /health is served)
spring.h2.console.enabled=false

# Disable Actuator exposure (entirely disabled)
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=
management.endpoint.health.enabled=false

# Enable Swagger/OpenAPI and configure UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Ensure canonical paths
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Limit scanning to our base package
springdoc.packages-to-scan=com.example.devxdashboardbackend

# Respect X-Forwarded-* / Forwarded headers for proxy environments
server.forward-headers-strategy=framework

# Ensure Whitelabel error page is disabled so our /error controller takes precedence
server.error.whitelabel.enabled=false

# Prefer JSON for errors; our GlobalErrorController will format /error
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never
